name: check

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      # The hero's render tool has its own lockfile. Nothing from it ships, but it runs on the owner's machine.
      - run: npm audit --audit-level=high --prefix hero-sequence
      - run: npm run check
      # The built site, in the runner's Chrome, under the same security headers the host sends.
      - run: npm run smoke
