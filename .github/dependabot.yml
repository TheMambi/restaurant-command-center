version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node version CI and the engines field name, so majors move together by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /hero-sequence
    schedule:
      interval: monthly
    target-branch: dev
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
