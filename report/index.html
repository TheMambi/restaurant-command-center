<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Command Center</title>
  <meta name="description" content="A report card for a restaurant's online presence: ratings, the Google profile, the website, social media, a competitor and what to do next. Shown with fictional restaurants.">
  <meta property="og:title" content="Restaurant Command Center">
  <meta property="og:description" content="A report card for a restaurant's online presence, with the three things to do first. Shown with fictional restaurants.">
  <meta property="og:image" content="https://restaurant-command-center-sable.vercel.app/og.png">
  <meta property="og:url" content="https://restaurant-command-center-sable.vercel.app/report/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0f0b08">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <script src="/boot.js"></script>
</head>
<body>
  <a class="skip-link" href="#panels">Skip to the report</a>
  <p class="sr-only" id="announcer" aria-live="polite"></p>

  <header class="topbar">
    <div class="container topbar-inner">
      <a class="wordmark" href="/" aria-label="Restaurant Command Center, home">
        <img src="/logo.svg" alt="" width="28" height="28">
        <span>Restaurant Command Center</span>
      </a>
      <div class="topbar-controls">
        <label class="field">
          <span class="field-label">Restaurant</span>
          <span class="select-wrap"><select id="restaurant-switcher"></select></span>
        </label>
        <button type="button" class="button" id="mode-toggle">Dark mode</button>
        <button type="button" class="button" id="print-report" aria-label="Print or save as PDF">Print</button>
      </div>
    </div>
  </header>

  <main id="main">
  <div class="container masthead">
    <h1 id="restaurant-name">Restaurant Command Center</h1>
    <p class="masthead-lede" id="restaurant-meta"></p>
    <p class="masthead-note" id="masthead-note"></p>
  </div>

  <nav class="tabs" aria-label="Report sections">
    <div class="container tablist" id="nav-tabs" role="tablist"></div>
  </nav>

  <div class="container panels" id="panels" tabindex="-1">
    <noscript><p>This report is built in the browser. Turn on JavaScript to see it.</p></noscript>
  </div>
  </main>

  <footer class="footer">
    <div class="container" id="footer-text"></div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
